name: Distribute master

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - name: Check package compatibility and core workflows
        run: node --import tsx --test tests/package-compatibility.test.ts tests/orchestration.test.ts tests/global-settings.test.ts tests/model-routing.test.ts tests/dirty-workspace.test.ts
      - name: Build and verify installable distribution
        run: npm run package:distribution
        env:
          DISTRIBUTION_CHANNEL: master
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distribution-${{ github.sha }}
          path: |
            artifacts/dsh-maintainer-workbench.tgz
            artifacts/SHA256SUMS
            artifacts/distribution.json
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # Reruns of the same commit cannot race each other. Different commits each
    # get a release, rather than dropping queued master updates.
    concurrency:
      group: distribution-release-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distribution-${{ github.sha }}
          path: artifacts
      - name: Publish commit-specific GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          cd artifacts
          sha256sum --check SHA256SUMS
          tag=$(jq -r .tag distribution.json)
          version=$(jq -r .version distribution.json)
          printf 'Prebuilt master package: %s\nSource commit: %s\n\nInstall the attached .tgz in Harness; installing the source Git URL still requires build approval.\n' "$version" "$SOURCE_SHA" > "$RUNNER_TEMP/release-notes.md"
          # The immutable tag identifies the source commit. Reruns replace only
          # assets for that same commit; API/auth failures are not hidden.
          status=$(curl --silent --show-error --output "$RUNNER_TEMP/release.json" --write-out '%{http_code}' --header "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GH_REPO/releases/tags/$tag")
          if [ "$status" = 404 ]; then
            gh release create "$tag" --target "$SOURCE_SHA" --prerelease --latest=false --title "$version" --notes-file "$RUNNER_TEMP/release-notes.md"
          elif [ "$status" != 200 ]; then
            echo "GitHub release lookup failed: HTTP $status" >&2
            exit 1
          fi
          gh release upload "$tag" dsh-maintainer-workbench.tgz SHA256SUMS distribution.json --clobber
          printf '### Distribution\n\n[Download package](https://github.com/%s/releases/download/%s/dsh-maintainer-workbench.tgz)\n' "$GH_REPO" "$tag" >> "$GITHUB_STEP_SUMMARY"

  npm:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && vars.PUBLISH_NPM_MASTER == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.21.0 --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distribution-${{ github.sha }}
          path: artifacts
      - name: Publish the same archive to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          cd artifacts
          sha256sum --check SHA256SUMS
          name=$(jq -r .name distribution.json)
          version=$(jq -r .version distribution.json)
          status=$(curl --silent --show-error --output "$RUNNER_TEMP/npm-version.json" --write-out '%{http_code}' "https://registry.npmjs.org/$name/$version")
          if [ "$status" = 200 ]; then
            test "$(jq -r .dist.shasum "$RUNNER_TEMP/npm-version.json")" = "$(jq -r .shasum distribution.json)"
            echo 'Identical npm version already published; skipping rerun.'
          elif [ "$status" = 404 ]; then
            # Immutable commit tags prevent older concurrent builds from moving
            # the master alias backwards. Every commit can still be published.
            npm publish dsh-maintainer-workbench.tgz --access public --tag "commit-$SOURCE_SHA" --ignore-scripts --provenance
          else
            echo "npm registry lookup failed: HTTP $status" >&2
            exit 1
          fi
      - name: Record npm package
        run: |
          printf '### npm distribution\n\nInstall `dsh-maintainer-workbench@%s` or `dsh-maintainer-workbench@commit-%s`.\n' "$(jq -r .version artifacts/distribution.json)" "${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"

  npm-master-tag:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && vars.PUBLISH_NPM_MASTER == 'true'
    needs: npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-master-tag
      cancel-in-progress: false
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.21.0 --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distribution-${{ github.sha }}
          path: artifacts
      - name: Update master alias only for the current master commit
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          current=$(gh api "repos/$GH_REPO/git/ref/heads/master" --jq .object.sha)
          if [ "$current" = "$SOURCE_SHA" ]; then
            npm dist-tag add "$(jq -r .name artifacts/distribution.json)@$(jq -r .version artifacts/distribution.json)" master
          else
            echo 'A newer master commit exists; preserving the current npm alias.'
          fi
